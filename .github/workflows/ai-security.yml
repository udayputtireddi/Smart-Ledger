name: AI backend security
on:
  pull_request:
  push:
    branches: [fix/authenticated-ai-backend]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:ai
      - run: npm run typecheck
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: npm run build:ai
      - run: npm run build
        env:
          GEMINI_API_KEY: AI_SECRET_SENTINEL_NOT_FOR_BROWSER_72819
          API_KEY: AI_SECRET_SENTINEL_NOT_FOR_BROWSER_72819
          VITE_API_KEY: AI_SECRET_SENTINEL_NOT_FOR_BROWSER_72819
          VITE_GEMINI_API_KEY: AI_SECRET_SENTINEL_NOT_FOR_BROWSER_72819
      - run: npm run check:ai-bundle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Verify gateway and quotas against emulators
        run: npm exec --prefix tests -- firebase emulators:exec --config firebase.json --only auth,firestore --project demo-smart-ledger "node --test tests/ai.integration.test.mjs"
        env:
          GCLOUD_PROJECT: demo-smart-ledger
          CI: 'true'
